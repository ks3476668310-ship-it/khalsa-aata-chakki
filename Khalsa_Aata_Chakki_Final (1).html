<!doctype html>
<html lang="pa">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ਖਾਲਸਾ ਆਟਾ ਚੱਕੀ</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef6ef;font-family:Arial,"Noto Sans Gurmukhi",sans-serif;color:#17351f}
.app{max-width:560px;margin:auto;padding:14px}
.header{background:#116b3a;color:#fff;border-radius:18px;padding:18px;text-align:center;box-shadow:0 4px 14px #0002}
.header h1{margin:0;font-size:26px}.header p{margin:5px 0 0;font-size:16px}
.card{background:#fff;border-radius:16px;padding:15px;margin-top:12px;box-shadow:0 2px 10px #0001}
label{display:block;font-weight:700;margin:8px 0 6px}
input[type=text],input[type=number],input[type=tel]{width:100%;height:50px;border:1px solid #c9d8cd;border-radius:11px;padding:10px 12px;font-size:18px;background:#fbfdfb}
.row{display:flex;gap:10px}.choice{flex:1}
.choice input{display:none}.choice label{height:52px;border:2px solid #cbd9cf;border-radius:11px;display:flex;align-items:center;justify-content:center;margin:0;background:#fff;font-size:17px;cursor:pointer}
.choice input:checked+label{border-color:#116b3a;background:#e4f5e9;color:#116b3a}
.section-title{font-size:19px;font-weight:800;margin-bottom:10px;color:#116b3a}
.badge{font-size:13px;background:#f2c94c;padding:3px 8px;border-radius:20px;margin-left:6px}
button{width:100%;height:56px;border:0;border-radius:13px;font-size:20px;font-weight:800;cursor:pointer}
#calculate{background:#116b3a;color:#fff;margin-top:14px}
#whatsapp{background:#25D366;color:#fff;margin-top:10px;display:none}
#reset{background:#e8eee9;color:#17351f;margin-top:10px}
.result{display:none;margin-top:12px}
.big{background:#e8f6eb;border:2px solid #116b3a;border-radius:14px;padding:15px;margin-top:10px;text-align:center}
.big small{display:block;font-size:16px;font-weight:700}.big strong{font-size:32px;display:block;margin-top:4px;color:#116b3a}
.money{background:#fff8df;border-color:#d49b00}.money strong{color:#9a6900}
.line{display:flex;justify-content:space-between;border-bottom:1px solid #e4e9e5;padding:9px 0;font-size:17px}
.note{font-size:13px;color:#617267;margin-top:8px}
.error{color:#a40000;font-weight:700;display:none;margin-top:8px}
</style>
</head>
<body>
<div class="app">
<div class="header"><h1>🌾 ਖਾਲਸਾ ਆਟਾ ਚੱਕੀ</h1><p>ਜਲਾਲਪੁਰ ਖੁਰਦ</p></div>

<div class="card">
<div class="section-title">👤 ਗਾਹਕ ਦੀ ਜਾਣਕਾਰੀ</div>
<label>ਗਾਹਕ ਦਾ ਨਾਮ *</label>
<input id="name" type="text" placeholder="ਨਾਮ ਲਿਖੋ">
<label>ਮੋਬਾਈਲ ਨੰਬਰ (Optional)</label>
<input id="mobile" type="tel" inputmode="numeric" placeholder="ਮੋਬਾਈਲ ਨੰਬਰ">
<label>ਕੁੱਲ ਕਣਕ (KG) *</label>
<input id="wheat" type="number" inputmode="decimal" min="0" step="0.01" placeholder="ਜਿਵੇਂ 50">
</div>

<div class="card">
<div class="section-title">⚖️ Normal <span class="badge">5%</span></div>
<div class="row">
<div class="choice"><input id="normalCut" name="normal" type="radio" checked><label for="normalCut">ਕਾਟ</label></div>
<div class="choice"><input id="normalCash" name="normal" type="radio"><label for="normalCash">ਨਗਦੀ</label></div>
</div>
</div>

<div class="card">
<div class="section-title">⚖️ ਰੂਲਾ <span class="badge">5%</span></div>
<div class="row">
<div class="choice"><input id="roolaCut" name="roola" type="radio" checked><label for="roolaCut">ਕਾਟ</label></div>
<div class="choice"><input id="roolaCash" name="roola" type="radio"><label for="roolaCash">ਨਗਦੀ</label></div>
</div>
</div>

<div class="card">
<div class="section-title">💵 ਪਿਸਾਈ</div>
<div class="row">
<div class="choice"><input id="grindCash" name="grind" type="radio" checked><label for="grindCash">₹1.50 / KG</label></div>
<div class="choice"><input id="grindCut" name="grind" type="radio"><label for="grindCut">5% ਕਾਟ</label></div>
</div>
</div>

<div class="card">
<div class="section-title">🌾 ਪਹਿਲਾਂ ਗਿਆ ਆਟਾ</div>
<input id="oldFlour" type="number" inputmode="decimal" min="0" step="0.01" value="0" placeholder="KG (Optional)">
<div class="note">ਜੇ ਪਹਿਲਾਂ ਕੋਈ ਆਟਾ ਗਿਆ ਹੈ ਤਾਂ KG ਲਿਖੋ।</div>
</div>

<div id="error" class="error"></div>
<button id="calculate">🧮 CALCULATE — ਹਿਸਾਬ ਕਰੋ</button>

<div id="result" class="result">
<div class="card">
<div class="line"><span>🌾 ਕੁੱਲ ਕਣਕ</span><b id="rWheat">0 KG</b></div>
<div class="line"><span>🌾 ਪਹਿਲਾਂ ਗਿਆ ਆਟਾ</span><b id="rOld">0 KG</b></div>
<div class="line"><span>💵 ਪਿਸਾਈ</span><b id="rGrind">₹0</b></div>
<div class="line"><span>💰 ਨਗਦੀ ਕਾਟ</span><b id="rCashCut">₹0</b></div>

<div class="big"><small>🌾 ਆਟਾ ਦੇਣਾ</small><strong id="rFlour">0 KG</strong></div>
<div class="big money"><small>💰 ਪੈਸੇ ਲੈਣੇ</small><strong id="rMoney">₹0</strong></div>
</div>
<button id="whatsapp">📲 WhatsApp ਤੇ ਭੇਜੋ</button>
<button id="reset">🔄 ਨਵਾਂ ਹਿਸਾਬ</button>
</div>
</div>

<script>
const $=id=>document.getElementById(id);
let last={};

function fmt(n){
  return Number(n.toFixed(2)).toString();
}
function rupee(n){
  return "₹"+fmt(n);
}

$("calculate").addEventListener("click",()=>{
  const name=$("name").value.trim();
  const w=parseFloat($("wheat").value);
  const oldRaw=parseFloat($("oldFlour").value);
  const old=isNaN(oldRaw)?0:Math.max(0,oldRaw);

  $("error").style.display="none";
  if(!name){$("error").textContent="ਕਿਰਪਾ ਕਰਕੇ ਗਾਹਕ ਦਾ ਨਾਮ ਲਿਖੋ।";$("error").style.display="block";$("name").focus();return}
  if(!isFinite(w)||w<=0){$("error").textContent="ਕਿਰਪਾ ਕਰਕੇ ਕਣਕ ਦੀ KG ਸਹੀ ਲਿਖੋ।";$("error").style.display="block";$("wheat").focus();return}
  if(old>w){$("error").textContent="ਪਹਿਲਾਂ ਗਿਆ ਆਟਾ ਕੁੱਲ ਕਣਕ ਤੋਂ ਵੱਧ ਨਹੀਂ ਹੋ ਸਕਦਾ।";$("error").style.display="block";return}

  const five=w*0.05;
  let cut=0, cashCut=0, grind=0;

  if($("normalCut").checked) cut+=five;
  else cashCut+=five*35;

  if($("roolaCut").checked) cut+=five;
  else cashCut+=five*35;

  if($("grindCut").checked) cut+=five;
  else grind=w*1.5;

  const flour=Math.max(0,w-cut-old);
  const totalMoney=cashCut+grind;

  last={name,w,old,flour,grind,cashCut,totalMoney};

  $("rWheat").textContent=fmt(w)+" KG";
  $("rOld").textContent=fmt(old)+" KG";
  $("rGrind").textContent=rupee(grind);
  $("rCashCut").textContent=rupee(cashCut);
  $("rFlour").textContent=fmt(flour)+" KG";
  $("rMoney").textContent=rupee(totalMoney);
  $("result").style.display="block";
  $("whatsapp").style.display="block";
  $("result").scrollIntoView({behavior:"smooth",block:"start"});
});

$("whatsapp").addEventListener("click",()=>{
  if(!last.name)return;
  const phone=$("mobile").value.replace(/\D/g,"");
  let msg=`🌾 ਖਾਲਸਾ ਆਟਾ ਚੱਕੀ
ਜਲਾਲਪੁਰ ਖੁਰਦ

👤 ਗਾਹਕ: ${last.name}

🌾 ਕੁੱਲ ਕਣਕ: ${fmt(last.w)} KG
🌾 ਪਹਿਲਾਂ ਗਿਆ ਆਟਾ: ${fmt(last.old)} KG
🌾 ਹੁਣ ਦਿੱਤਾ ਆਟਾ: ${fmt(last.flour)} KG
💵 ਪਿਸਾਈ: ${rupee(last.grind)}

━━━━━━━━━━━━━━
🌾 ਆਟਾ ਦੇਣਾ: ${fmt(last.flour)} KG
💰 ਪੈਸੇ ਲੈਣੇ: ${rupee(last.totalMoney)}
━━━━━━━━━━━━━━

ਧੰਨਵਾਦ ਜੀ 🙏`;

  const url=phone
    ? "https://wa.me/91"+phone+"?text="+encodeURIComponent(msg)
    : "https://wa.me/?text="+encodeURIComponent(msg);
  window.open(url,"_blank");
});

$("reset").addEventListener("click",()=>{
  $("name").value="";
  $("mobile").value="";
  $("wheat").value="";
  $("oldFlour").value="0";
  $("normalCut").checked=true;
  $("roolaCut").checked=true;
  $("grindCash").checked=true;
  $("result").style.display="none";
  $("whatsapp").style.display="none";
  $("error").style.display="none";
  window.scrollTo({top:0,behavior:"smooth"});
});
</script>
</body>
</html>
